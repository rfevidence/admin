<!-- ==========================================================================
     CONNECTING maclesotho.com TO THE ADMIN PORTAL

     This file is a reference, not a page. Nothing here gets deployed. You copy
     one line out of it into the website you already have.
     ========================================================================== -->


<!-- ===================== THE ONLY THING YOU ADD =========================== -->

<script src="https://mac-admin-portal.onrender.com/intake.js" defer></script>

<!-- ======================================================================= -->


<!--
  WHERE IT GOES
    Open index.html in your website repository. Find the closing </body> tag
    near the bottom. Paste that one line just above it. Commit. Done.

    Change the address if your Render service is named something else, or if
    you set up the portal.maclesotho.com subdomain - use whichever address you
    actually sign in at.

  WHAT IT DOES
    The portal serves that script itself, already carrying its own address and
    intake key, so there is nothing to configure and no key to paste. When the
    page loads, the script:

      - finds your consultation form
      - adds a hidden honeypot field to it, so bots are filtered without you
        editing the form at all
      - copies each submission to the portal as the visitor presses send

    Your EmailJS send is untouched. The script listens in the capture phase, so
    it still works even though your handler calls preventDefault(). If the
    portal is asleep or unreachable, the request is abandoned after nine
    seconds and the visitor sees your normal success message either way. The
    email always goes out; only the portal record is at risk, never the enquiry.

  HOW IT FINDS YOUR FORM
    It looks for a form mentioning nationality, immigration, visa, permit,
    consultation or enquiry, or one with a nationality or service field. Your
    intake form matches on several counts. Other forms on the page - a
    newsletter box, a search field - are left alone.

    If you would rather be explicit, or if you ever restructure the page, add
    this attribute to your form tag and it will always be chosen:

        <form id="consultationForm" data-mac-intake>

  YOUR FIELD NAMES ARE ALREADY FINE
    The portal accepts several spellings for each field, so you almost
    certainly do not need to rename anything:

      first name   first_name, firstName, first, from_first_name
      last name    last_name, lastName, surname, from_last_name
      email        email, email_address, from_email, reply_to
      phone        phone, contact_number, contactNumber, tel, mobile
      occupation   occupation, job, profession
      address      address, physical_address, physicalAddress
      nationality  nationality, citizenship
      residence    country_residence, country_of_residence, residence
      service      service, service_required, immigration_service
      destination  destination, destination_country, destinationCountry
      permit       permit_status, current_status, visa_status
      years        years_in_lesotho, years, yearsInLesotho
      criminal     criminal_record, criminal, convictions
      rejection    prior_rejection, previous_rejection, rejected
      description  message, situation, details, notes, description
      consent      consent

    Text boxes, dropdowns, radio buttons, checkboxes and text areas are all
    read correctly. Anything the portal does not recognise is ignored rather
    than refused.

  CHECKING IT WORKS
    1. Open maclesotho.com and submit the form with your own details.
    2. Sign in to the portal. The enquiry is under Enquiries with a New badge.

    If it is not there, open the System page. Every attempt is listed with the
    reason it was turned away - wrong key, blocked domain, or honeypot. That
    page tells you exactly what to fix. The browser console on your website
    also prints a line beginning [MAC] if anything went wrong.

  IF YOU EVER ROTATE THE INTAKE KEY
    Nothing to do. The script is served by the portal and picks up the new key
    on its own within five minutes. This is the main reason it works this way
    rather than as a block of code pasted into your site.
-->
